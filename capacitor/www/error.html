<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scorpio Rising</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0c2a23; color: #f4f1ea; font-family: -apple-system, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
      h1 { font-weight: 300; font-size: 1.6rem; margin: 0 0 8px; }
      p { color: #9bb3aa; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
      button { background: #1fc896; color: #072019; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>The stars are out of reach.</h1>
      <p>Scorpio Rising needs an internet connection. Check your connection and try again.</p>
      <button onclick="window.location.href='https://www.scorpiorising.ai/'">Try again</button>
    </main>
  </body>
</html>
