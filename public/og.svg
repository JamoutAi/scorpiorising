<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#0f3329"/>
      <stop offset="55%" stop-color="#0c2a23"/>
      <stop offset="100%" stop-color="#08201a"/>
    </radialGradient>
    <g id="logo">
      <!-- fingerprint ridges -->
      <g fill="none" stroke="#6b46a8" stroke-width="7" stroke-linecap="round" opacity="0.95">
        <path d="M-66 -8 C -86 -58, -30 -96, 0 -96 C 30 -96, 86 -58, 66 -8 C 52 28, 18 48, -18 48"/>
        <path d="M-96 6 C -120 -64, -46 -132, 0 -132 C 46 -132, 120 -64, 96 6 C 76 64, 24 92, -24 92"/>
        <path d="M-126 22 C -150 -68, -56 -166, 0 -166 C 56 -166, 150 -68, 126 22 C 98 96, 30 130, -30 130"/>
        <path d="M-156 40 C -180 -72, -62 -198, 0 -198 C 62 -198, 180 -72, 156 40 C 120 134, 36 174, -36 174"/>
      </g>
      <!-- inner core swirl -->
      <g fill="none" stroke="#8a5fc4" stroke-width="6" stroke-linecap="round" opacity="0.9">
        <path d="M-34 -6 C -44 -40, -14 -64, 6 -58 C 26 -52, 30 -26, 14 -14 C 0 -4, -14 -10, -10 -26"/>
      </g>
      <!-- constellation (Draco-style) stars + lines, mint -->
      <g stroke="#1fc896" stroke-width="1.6" opacity="0.55" fill="none">
        <path d="M-70 -120 L -30 -96 L 6 -110 L 40 -78 L 70 -96 L 40 -40 L 0 -8 L -40 -44 L -70 -12 L -34 20"/>
      </g>
      <g fill="#bdf3e0">
        <circle cx="-70" cy="-120" r="4"/><circle cx="-30" cy="-96" r="4.5"/>
        <circle cx="6" cy="-110" r="4"/><circle cx="40" cy="-78" r="5"/>
        <circle cx="70" cy="-96" r="4"/><circle cx="40" cy="-40" r="4.5"/>
        <circle cx="0" cy="-8" r="5"/><circle cx="-40" cy="-44" r="4"/>
        <circle cx="-70" cy="-12" r="4.5"/><circle cx="-34" cy="20" r="4"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(600 250) scale(1.05)">
    <use href="#logo"/>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#f4f1ea" letter-spacing="2">Scorpio Rising</text>
  <text x="600" y="512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1fc896" letter-spacing="6">YOUR AI JOURNALING COMPANION</text>
  <text x="600" y="556" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="23" fill="#c5a46b">Your rising sign is your story. This is where you write it.</text>
</svg>
